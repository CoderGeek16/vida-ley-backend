// 🔥 TU BACKEND EN RENDER
function resolveApiBase(){

  const queryApi = new URLSearchParams(window.location.search).get("api");
  const savedApi = localStorage.getItem("vidaLeyApi");

  if(queryApi){
    const normalized = queryApi.replace(/\/+$/, "");
    localStorage.setItem("vidaLeyApi", normalized);
    return normalized;
  }

  if(savedApi){
    return savedApi.replace(/\/+$/, "");
  }

  if(["localhost","127.0.0.1"].includes(window.location.hostname)){
    return "http://localhost:3000";
  }

  return "https://vida-ley-backend.onrender.com";
}

const API = resolveApiBase();

// =====================
// LOGIN
// =====================
   async function login(){
try{
const password = document.getElementById("pass").value;


const r = await fetch(API + "/auth/login", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  credentials: "include",
  body: JSON.stringify({
    dni: "admin",
    password: password
  })
});

// DEBUG HTTP
console.log("STATUS HTTP:", r.status);

const res = await r.json();

// DEBUG RESPUESTA BACKEND
console.log("RESPUESTA LOGIN:", res);

// VALIDACIÓN REAL
if(!r.ok || !res.ok){
  alert("Clave incorrecta");
  return;
}

console.log("LOGIN OK - entrando al panel");

document.getElementById("login").style.display = "none";
document.getElementById("panel").style.display = "block";

// 👇 pequeño delay para asegurar cookie
setTimeout(() => {
  dashboard();
}, 300);


}catch(e){
console.error("ERROR LOGIN:", e);
alert("Error de conexión");
}
}



// =====================
// LOGOUT
// =====================
async function logout(){
  await fetch(API + "/auth/logout", {
    method:"POST",
    credentials: "include"
  });

  location.reload();
}

// =====================
// DASHBOARD
// =====================
async function dashboard(){

  document.getElementById("dashboardSection").style.display = "block";
  document.getElementById("colaboradoresSection").style.display = "none";

  const r = await fetch(
    API + "/admin/dashboard",
    {
      credentials:"include"
    }
  );

  const res = await r.json();

  if(!res.ok){
    return;
  }

  let total = 0;
  let registrados = 0;

  res.data.forEach(x => {
    total += x.total;
    registrados += x.registrados;
  });

  const faltan =
    total - registrados;

  const avance =
    total > 0
      ? Math.round(
          registrados * 100 / total
        )
      : 0;

  document.getElementById("cards").innerHTML = `

<div class="card">
  <div>👨‍💼 Total colaboradores</div>

  <div style="
    font-size:40px;
    font-weight:700;
    margin-top:10px;
    color:#0d4f5a;
  ">
    ${total}
  </div>
</div>

<div class="card">
  <div>✅ Registrados</div>

  <div style="
    font-size:40px;
    font-weight:700;
    margin-top:10px;
    color:#198754;
  ">
    ${registrados}
  </div>
</div>

<div class="card">
  <div>⏳ Pendientes</div>

  <div style="
    font-size:40px;
    font-weight:700;
    margin-top:10px;
    color:#dc3545;
  ">
    ${faltan}
  </div>
</div>

<div class="card">
  <div>📈 Avance General</div>

  <div style="
    font-size:40px;
    font-weight:700;
    margin-top:10px;
    color:#0d6efd;
  ">
    ${avance}%
  </div>
</div>

  <table class="dashboard-table" style="margin-top:20px">

    <tr>
      <th>Sede</th>
      <th>Total</th>
      <th>Registrados</th>
      <th>Falta</th>
      <th>%</th>
    </tr>

${res.data.map(x => {

const color =
  x.avance >= 80
    ? "#198754"
    : x.avance >= 50
      ? "#ffc107"
      : "#dc3545";

return `
<tr>

<td>${x.sede}</td>

<td>${x.total}</td>

<td>${x.registrados}</td>

<td>${x.falta}</td>

        <td>

          <div style="
            background:#eee;
            border-radius:20px;
            overflow:hidden;
          ">

      <div style="
        width:${x.avance}%;
        background:${color};
        color:white;
        text-align:center;
        padding:6px;
        border-radius:20px;
        font-weight:600;
      ">
              ${x.avance}%
            </div>

          </div>

        </td>

      </tr>

`;
}).join("")}

  </table>
  `;
}


// =====================
// LISTAR
// =====================
async function listar(){

  document.getElementById("dashboardSection").style.display = "none";
  document.getElementById("colaboradoresSection").style.display = "block";

  console.log("LISTAR EJECUTADO");

  try{

    const r = await fetch(API + "/admin/colaboradores", {
      credentials: "include"
    });

    console.log("STATUS:", r.status);

    const res = await r.json();

    console.log("RESPUESTA:", res);

    // 🔴 VALIDACIÓN CLAVE
    if(!r.ok || !res.ok){
      document.getElementById("tabla").innerHTML = "No autorizado o sesión expirada";
      return;
    }

    // 🟡 SIN DATOS
    if(!res.data || res.data.length === 0){
      document.getElementById("tabla").innerHTML = "No hay colaboradores registrados";
      return;
    }

        let html = `
      <table>
        <tr>
          <th>DNI</th>
          <th>Nombres</th>
          <th>Sede</th>
          <th>Beneficiarios</th>
          <th>Acción</th>
        </tr>
    `;

    res.data.forEach(c => {

      const tieneBeneficiarios =
        c.beneficiarios &&
        c.beneficiarios.length > 0;

      html += `
        <tr>

          <td>${c.dni}</td>

          <td>
            ${c.nombres}
            ${c.apellido_paterno}
            ${c.apellido_materno}
          </td>

          <td>
            ${c.sedes?.sede || "Sin sede"}
          </td>

    <td>
      ${tieneBeneficiarios ? "✅ Sí" : "-"}
    </td>

          <td>
            <button onclick="ver(${c.id})">
              Ver
            </button>

            <button
              onclick="eliminar(${c.id})"
              style="color:red"
            >
              Eliminar
            </button>
          </td>

        </tr>
      `;
    });

    html += "</table>";

    document.getElementById("tabla").innerHTML = html;

  }catch(e){
    console.error("ERROR LISTAR:", e);
    document.getElementById("tabla").innerHTML = "Error de conexión con el servidor";
  }
}

// =====================
// HISTORIAL
// =====================
async function ver(id){
const res = await fetch(API + "/admin/historial/" + id, {
credentials: "include"
}).then(r=>r.json());

let html = "<h3>Historial</h3>";

if(!res.beneficiarios || res.beneficiarios.length === 0){
html += "<div>No tiene beneficiarios registrados</div>";
}else{
res.beneficiarios.forEach(b => {

  const primerNombre =
    (b.nombres || "").trim().split(" ")[0];

html += `
<div style="
padding:8px;
margin:5px 0;
background:#fff;
border-left:4px solid #198754;
border-radius:6px;
box-shadow:0 1px 4px rgba(0,0,0,.05);
">
👤 ${primerNombre} ${b.apellido_paterno}
</div>
`;

});
}

document.getElementById("detalle").innerHTML = html;
}

// BUSCAR
// =====================
    async function buscar(e){
    if(e.key !== "Enter") return;

    const dni = e.target.value;

    const r = await fetch(API + "/colaborador/" + dni, {
    credentials: "include"
    });

    const res = await r.json();

    if(!res.ok){
    alert("DNI no registrado o sin datos");
    return;
    }

    ver(res.data.id);
    }

    // ===============================
// 🗑️ ELIMINAR
// ===============================
  async function eliminar(id){
  if(!confirm("¿Seguro que deseas eliminar este colaborador?")) return;

  const r = await fetch(API + "/eliminar-datos/" + id, {
  method: "DELETE",
  credentials: "include"
  });

  const res = await r.json();

  if(res.ok){
  alert("Eliminado correctamente");
  listar();
  }else{
  alert("Error al eliminar");
  }
}

// ===============================
// 🗑️ ELIMINAR TODOS
// ===============================
async function eliminarTodos(){

  const confirmar = confirm(
    "⚠️ Esto eliminará TODOS los colaboradores y beneficiarios.\n\n¿Deseas continuar?"
  );

  if(!confirmar) return;

  const confirmar2 = confirm(
    "⚠️ ÚLTIMA CONFIRMACIÓN\n\nEsta acción NO se puede deshacer."
  );

  if(!confirmar2) return;

  try{

    const r = await fetch(API + "/admin/eliminar-todos", {
      method: "DELETE",
      credentials: "include"
    });

    const res = await r.json();

    if(res.ok){
      alert("✅ Todos los registros fueron eliminados");
      listar();
      dashboard();
    }else{
      alert("❌ Error al eliminar registros");
    }

  }catch(e){
    console.error(e);
    alert("Error de conexión");
  }
}

function mostrarFormulario(){

  const form =
    document.getElementById("formColaborador");

  form.style.display =
    form.style.display === "none"
      ? "block"
      : "none";

}

async function guardarColaborador(){

  const data = {

    dni:
      document.getElementById("dniNuevo").value,

    apellido_paterno:
      document.getElementById("apPatNuevo").value,

    apellido_materno:
      document.getElementById("apMatNuevo").value,

    nombres:
      document.getElementById("nomNuevo").value,

    fecha_nacimiento:
      document.getElementById("fecNacNuevo").value,

    id_genero:
      document.getElementById("sexoNuevo").value,

    idsede:
      document.getElementById("sedeNuevo").value

  };

  const r = await fetch(
    API + "/admin/colaborador",
    {
      method:"POST",
      credentials:"include",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify(data)
    }
  );

  const res = await r.json();

  if(res.ok){

    alert("Colaborador registrado");

    listar();

    document.getElementById(
      "formColaborador"
    ).style.display = "none";

  }else{

    alert(res.msg || "Error al guardar");

  }

}
async function cargarExcel(event){

try{

const archivo =
event.target.files[0];

if(!archivo){
return;
}

const data =
await archivo.arrayBuffer();

const workbook =
XLSX.read(data);

const hoja =
workbook.Sheets[
workbook.SheetNames[0]
];

const filas =
XLSX.utils.sheet_to_json(hoja);

if(filas.length === 0){
alert("El archivo está vacío");
return;
}

const r = await fetch(
API + "/admin/carga-masiva",
{
method:"POST",
credentials:"include",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(filas)
});

const res = await r.json();

if(res.ok){

if(res.cantidad === 0){

  alert(
    "Todos los DNI del archivo ya existen"
  );

}else{

  alert(
    `✅ Se registraron ${res.cantidad} colaboradores`
  );

}

listar();

}else{

alert(
res.error || "Error en carga masiva"
);

}

}catch(e){

console.error(e);

alert("Error procesando Excel");

}

}

// ===============================
// 📊 DESCARGAR EXCEL
// ===============================
async function descargarExcel(){

  try{

    const r = await fetch(API + "/admin/colaboradores", {
      credentials: "include"
    });

    const res = await r.json();

    if(!res.ok){
      alert("No se pudieron obtener los datos");
      return;
    }

    const datos = res.data.map(c => ({
      DNI: c.dni,
      Nombres: `${c.nombres} ${c.apellido_paterno} ${c.apellido_materno}`,
      Sede: c.sedes?.sede || "Sin sede",
      Beneficiarios:
        (c.beneficiarios && c.beneficiarios.length > 0)
          ? "Sí"
          : "No"
    }));

    const ws = XLSX.utils.json_to_sheet(datos);

    const wb = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
      wb,
      ws,
      "Colaboradores"
    );

    XLSX.writeFile(
      wb,
      "Colaboradores_Vida_Ley.xlsx"
    );

  }catch(e){
    console.error(e);
    alert("Error al generar Excel");
  }
}
